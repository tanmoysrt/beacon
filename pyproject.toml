[project]
name = "beacon"
version = "0.1.0"
description = "A small coordination service with object change streaming"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "uvloop",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
beacon = "beacon.main:main"
